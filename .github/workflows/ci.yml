name: Offline acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: um
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: um
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U um"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UM_TEST_DATABASE_URL: postgresql+psycopg://um:local-test-only@localhost:5432/um
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: mypy um_agentic
      - run: pytest -m "not live"
      - run: um schemas && git diff --exit-code -- docs/schemas
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
