[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "um-agentic"
version = "0.1.0"
description = "Synthetic, human supervised utilization management reference implementation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1",
  "fhir.resources>=8.1,<9",
  "pypdf>=5,<7",
  "reportlab>=4,<5",
  "python-multipart>=0.0.20,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
]

[project.optional-dependencies]
cloud = [
  "agent-framework-foundry>=1,<2",
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "azure-ai-documentintelligence>=1,<2",
  "azure-search-documents>=11.6,<12",
  "azure-monitor-opentelemetry-exporter>=1.0.0b58,<2",
  "PyJWT[crypto]>=2.10,<3",
]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "hypothesis>=6.120,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6",
]

[project.scripts]
um = "um_agentic.cli:main"

[tool.setuptools.packages.find]
include = ["um_agentic*"]

[tool.setuptools.package-data]
um_agentic = ["config/*.json", "criteria/*.yaml", "agents/*/prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "postgres: requires UM_TEST_DATABASE_URL",
  "live: explicitly enabled live model evaluation",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
